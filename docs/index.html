<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkyBlast 2D — 环形大世界 2D 横版 PVP</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #game { display: block; width: 100%; height: 100%; }
  .btn { position: fixed; z-index: 10; border: 0; border-radius: 12px; background: rgba(255,255,255,.15); color: #fff;
    font-size: 16px; padding: 12px 16px; touch-action: none; user-select: none; -webkit-user-select: none; }
  #btn-fullscreen { top: 10px; right: 10px; }
  #btn-jump  { bottom: 20px; right: 100px; width: 66px; height: 66px; border-radius: 50%; font-size: 18px; }
  #btn-jet   { bottom: 20px; right: 184px; width: 66px; height: 66px; border-radius: 50%; font-size: 18px; }
  #btn-reload{ bottom: 20px; right: 268px; width: 56px; height: 56px; border-radius: 50%; }
  #hint { position: fixed; bottom: 6px; left: 12px; color: rgba(255,255,255,.6); font-size: 12px; z-index: 10; max-width: 78%; line-height: 1.5; }
  #links { position: fixed; bottom: 6px; right: 12px; color: rgba(255,255,255,.45); font-size: 12px; z-index: 10; }
  #links a { color: rgba(160,200,255,.8); text-decoration: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="btn-fullscreen" class="btn">⛶ 全屏</button>
<button id="btn-jump" class="btn">起飞</button>
<button id="btn-jet" class="btn">喷</button>
<button id="btn-reload" class="btn">装</button>
<div id="hint">桌面：A/D 移动 · W/空格/↑ 起飞（耗能量）· 鼠标瞄准 · 左键开火 · R 装填 · 1-4 换主武器 · T 切副武器 · G 使用副武器 · E 交互（迫击炮）｜ 触屏：左半屏移动 · 右半屏瞄准+开火 · 底部按钮 起飞/喷/装</div>
<div id="links"><a href="./replay.html">对局回放</a> · <a href="./tuning.html">物理调参</a></div>
<script src="./bundle.js?v=7"></script>
</body>
</html>
