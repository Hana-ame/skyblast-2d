<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SkyBlast 2D · 地图编辑器</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; }
  #editorCanvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #toolbar { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(15,23,42,.94); border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  button:hover { border-color: #64748b; background: #273449; }
  button.active { background: #0e7490; border-color: #22d3ee; color: #ecfeff; }
  .hint { font-size: 11px; color: #94a3b8; line-height: 1.5; }
  #status { font-size: 11px; color: #67e8f9; font-weight: 700; }
  input[type=range] { width: 120px; }
</style>
</head>
<body>
<canvas id="editorCanvas"></canvas>
<div id="toolbar">
  <div class="row"><strong style="font-size:13px;color:#fbbf24">地图编辑器</strong><span id="status">0 块</span></div>
  <div class="row">
    <button id="kindPlatform" class="active" data-kind="platform">平台</button>
    <button id="kindCover" data-kind="cover">掩体</button>
    <button id="kindBlock" data-kind="block">方块</button>
  </div>
  <div class="row">
    <span class="hint">笔刷</span>
    <input id="brushSize" type="range" min="1" max="10" step="1" value="1" />
    <span id="brushLabel" class="hint">1×20px</span>
  </div>
  <div class="row">
    <button id="btnSave">保存</button>
    <button id="btnApply">应用到游戏</button>
    <button id="btnReset">默认地图</button>
    <button id="btnClear">清空</button>
  </div>
  <div class="row">
    <button id="btnExport">导出 JSON</button>
    <button id="btnImport">导入 JSON</button>
  </div>
  <div class="hint">
    左键拖拽绘制 · 右键擦除 · 滚轮缩放 · 中键/空格拖拽平移<br />
    坐标：世界 13200×4400，地面 y=2800；格点 20px
  </div>
</div>
<script src="./editor-bundle.js"></script>
</body>
</html>
