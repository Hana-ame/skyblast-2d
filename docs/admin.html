<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SkyBlast 2D · 数值调整后台</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; }
  body { padding: 14px 16px 60px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #fbbf24; }
  .sub { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
  .toolbar { position: sticky; top: 0; z-index: 10; background: rgba(2,6,23,.95); padding: 8px 0 10px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #1e293b; margin-bottom: 12px; }
  button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  button:hover { background: #273449; border-color: #64748b; }
  button.primary { background: #047857; border-color: #10b981; }
  button.danger { background: #7f1d1d; border-color: #f87171; }
  section { margin: 16px 0 20px; border: 1px solid #1e293b; border-radius: 12px; padding: 12px 14px; background: rgba(15,23,42,.5); }
  section > h2 { font-size: 14px; margin: 0 0 10px; color: #67e8f9; }
  .wep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; }
  .card { border: 1px solid #273449; border-radius: 10px; padding: 8px 10px; background: rgba(2,6,23,.6); }
  .card h3 { font-size: 13px; margin: 0 0 6px; color: #fde68a; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
  label { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: #94a3b8; align-items: center; }
  input[type=number], input[type=text] { width: 84px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 2px 4px; font-size: 11px; }
  input[type=checkbox] { accent-color: #22d3ee; }
  .tag { font-size: 10px; color: #64748b; }
  #status { font-size: 12px; color: #4ade80; margin-left: auto; }
  #jsonBox { width: 100%; height: 120px; display: none; margin-top: 10px; background: #0f172a; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 8px; font-family: ui-monospace, monospace; font-size: 11px; }
</style>
</head>
<body>
<h1>数值调整后台</h1>
<div class="sub">修改武器 / 全局 / 物理参数 → 保存到浏览器（<code>skyblast_balance_overrides_v1</code>）→ 应用到游戏。留空的字段表示不覆盖（用默认值）。</div>
<div class="toolbar">
  <button id="btnSave" class="primary">保存覆盖</button>
  <button id="btnApply">保存并打开游戏</button>
  <button id="btnReset" class="danger">恢复默认</button>
  <button id="btnExport">导出 JSON</button>
  <button id="btnImport">导入 JSON</button>
  <button id="btnGame">打开游戏</button>
  <span id="status"></span>
</div>
<div id="app"></div>
<textarea id="jsonBox" spellcheck="false"></textarea>
<script src="./admin-bundle.js"></script>
</body>
</html>
